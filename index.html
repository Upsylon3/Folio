<script>
/* =====================================================================================================================
 FOLIO: single-file card game. Every English Wikipedia article is a card; rarity and stats are computed from 3 numbers.
 Everything (HTML, CSS, JS) is in this file on purpose: it can be hosted as one static page (e.g. GitHub Pages).

 FILE MAP (top to bottom)
  1. LOGIC block   Pure functions, no DOM, no network: rarity rate(), pack building, regen, daily claims, battles, and the
                   index helpers (bucketTier, pickShard, idxArticle, stockPlan). folio.test.js cuts this block out between the
                   two marker comments named LOGIC and END and runs it in node, so: keep it pure, and do not move or rename
                   those markers. CFG (top of the block) holds every tunable number.
  2. Wikipedia     Live API helpers (wapi, enrich, randomArts, topArts). Used when there is no static index, and always for the
                   daily boss.
  3. State         S = saved progress in localStorage ('folio.v1'); RC = rarity cache; DISC = previewed articles.
  4. Views         V.<tab>() return HTML strings; render() swaps them into #main. cardHTML() draws one card.
  5. Actions       Stock of ready-to-draw articles (POOL, localStorage 'folio.pool', 6h), fill(), openPack(), modal, event handlers.

 WHERE CARD DATA COMES FROM (two sources, same article shape {id,title,desc,thumb,url,length,views,cats,vd})
  a) Static index (preferred): idx/manifest.json + idx/bBB-SSS.json shards, produced offline by build_index.py from the Wikipedia
     dumps (views = one monthly page-view file averaged per day). fill() loads it through IDXP/IDX and indexSample(). Serve this
     page over http(s); from file:// the fetch fails and the game falls back to (b).
  b) Live API (fallback): random + top articles, enriched with 60-day views and category counts, one request batch per fill.
  `vd` = number of days the `views` average covers (index: manifest.viewDays, API: 60); only used for the tooltip text.

 INVARIANTS
  - rate() here and score() in build_index.py are the same formula (ranges, weights, log scale). test_build_index.py runs both and
    fails if they drift. Change one, change the other, run both test files.
  - Missing data is null, never a made-up number; rate() skips it and renormalises weights (ATK/DEF fall back to 10, shown with *).
  - Tier cut-offs in CFG.cuts must stay multiples of 0.01: the index has 100 score buckets and bucketTier() relies on that.
  - Battles are fully deterministic (no RNG) so they can be replayed and tested.
 ===================================================================================================================== */
/*LOGIC*/
const CFG={cap:40,regenMs:360000,packSize:5,startPacks:20,pityAfter:9,srIdx:3,
 tiers:[{n:'Common',s:'C',c:'#8a8f98'},{n:'Uncommon',s:'U',c:'#6fae8c'},{n:'Rare',s:'R',c:'#5b8fd6'},{n:'Super Rare',s:'SR',c:'#a77be0'},{n:'Epic',s:'E',c:'#d96a8a'},{n:'Legendary',s:'L',c:'#e8c76a'},{n:'Legend Rare',s:'LR',c:'#f4f1e8'}],
 weights:[55,22,12,6.5,3,1.2,.3],cuts:[.28,.40,.52,.63,.73,.83],
 w:{depth:.4,pop:.3,qual:.3},range:{len:[500,200000],views:[5,100000],cats:[1,30]},daily:{login:10,explore:2},season:{share:.7,size:[300,200,120,80,50,30,20]}};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lg=(x,[lo,hi])=>clamp((Math.log(Math.max(x,1))-Math.log(lo))/(Math.log(hi)-Math.log(lo)),0,1);
// Rarity = deterministic function of metadata. depth=length, pop=avg daily views, qual=category count (a rough proxy, NOT an official quality score).
// Missing inputs are skipped and weights renormalised; missing ATK/DEF fall back to 10 and are flagged est.
function rate(a,C=CFG){const R=C.range,d=a.length!=null?lg(a.length,R.len):null,p=a.views!=null?lg(a.views,R.views):null,q=a.cats!=null?lg(a.cats,R.cats):null;
 let s=0,w=0;for(const[v,k]of[[d,C.w.depth],[p,C.w.pop],[q,C.w.qual]])if(v!=null){s+=v*k;w+=k}
 const score=w?s/w:0;let tier=0;while(tier<C.cuts.length&&score>=C.cuts[tier])tier++;
 return{tier,score,atk:p==null?10:10+Math.round(90*p),def:d==null?10:10+Math.round(90*d),hp:30+tier*12+Math.round(30*score),est:{atk:p==null,def:d==null}}}
function rollTier(rng,C=CFG){let r=rng()*C.weights.reduce((x,y)=>x+y);for(let i=0;i<C.weights.length;i++){r-=C.weights[i];if(r<0)return i}return 0}
function pick(pool,target,used,rng,min){const c=pool.filter(x=>!used.has(x.a.id)&&(min==null||x.r.tier>=min));if(!c.length)return null;
 const b=Math.min(...c.map(x=>Math.abs(x.r.tier-target))),e=c.filter(x=>Math.abs(x.r.tier-target)===b);
 // Tie-break only: among equally fitting candidates prefer one with artwork (85% of the time), so odds are untouched and text-only cards still appear.
 const img=e.filter(x=>x.a.thumb),f=img.length&&rng()<.85?img:e;return f[Math.floor(rng()*f.length)]}
// Returns 5 distinct {a,r} sorted low->high, or null if pool can't satisfy the request (caller must not consume a pack then).
function buildPack(pool,pity,rng,C=CFG){const T=Array.from({length:C.packSize},()=>rollTier(rng,C)).sort((x,y)=>y-x),used=new Set(),out=[];
 for(const t of T){const c=pick(pool,t,used,rng);if(!c)return null;used.add(c.a.id);out.push(c)}
 if(pity>=C.pityAfter&&!out.some(x=>x.r.tier>=C.srIdx)){const c=pick(pool,C.srIdx,used,rng,C.srIdx);if(!c)return null;out[out.length-1]=c}
 return out.sort((x,y)=>x.r.tier-y.r.tier)}
function regen(s,now){if(now<s.last)s.last=now;if(s.packs>=CFG.cap){s.last=now;return s}
 const n=Math.floor((now-s.last)/CFG.regenMs);if(n>0){s.packs=Math.min(CFG.cap,s.packs+n);s.last=s.packs>=CFG.cap?now:s.last+n*CFG.regenMs}return s}
const day=(t=Date.now())=>new Date(t).toISOString().slice(0,10);
function claim(s,key,now){if(s.daily[key]===day(now))return 0;s.daily[key]=day(now);s.packs+=CFG.daily[key];return CFG.daily[key]}
function addCards(col,cards,now){return cards.map(({a})=>{const e=col[a.id];if(e){e.n++;e.last=now;return{a,dup:true,n:e.n}}col[a.id]={a,n:1,first:now,last:now};return{a,dup:false,n:1}})}
function norm(p){if(!p||p.missing||p.invalid||(p.ns!=null&&p.ns!==0)||(p.pageprops&&'disambiguation' in p.pageprops))return null;
 const d=(p.terms&&p.terms.description&&p.terms.description[0])||'';if(/disambiguation/i.test(d))return null;
 const v=p.pageviews?Object.values(p.pageviews).filter(x=>x!=null):[];
 return{id:p.pageid,title:p.title,desc:d,thumb:(p.thumbnail&&p.thumbnail.source)||null,url:p.canonicalurl||p.fullurl,lang:'en',length:p.length??null,views:v.length?v.reduce((x,y)=>x+y,0)/v.length:null,cats:p.categories?p.categories.length:null}}
// ---- Battles. Fully deterministic: no RNG anywhere, so a fight can be replayed and tested.
CFG.battle={raidMult:28,practiceMult:8,raidMax:5,practiceMax:3,maxRounds:50,raidReward:5,raidInk:25,rematchInk:0,practiceInkCap:60,advantage:1.5,aura:.1};
// Ink is the soft currency: pressed duplicates, battles and set goals pay it; the market and nothing else spends it.

// ---------- Actions ----------
// Stock of ready-to-draw articles. Packs come out of it instantly and it is topped up in the background, so the player
// rarely waits on Wikipedia. Persisted for 6h (views move slowly) to make a reload feel instant too.
const POOLKEY='folio.pool';let POOL=[],POOLSRC='',filling=null,FERR='';
try{const p=JSON.parse(localStorage.getItem(POOLKEY));if(p&&Date.now()-p.t<6*36e5){POOL=p.arts;POOLSRC=p.src||''}}catch{}
function persistPool(){try{localStorage.setItem(POOLKEY,JSON.stringify({t:Date.now(),src:POOLSRC,arts:POOL}))}catch{}}
// The stock is only valid for the data source that produced it. Without this, switching from one index to another (say Simple English
// to English) kept drawing the old articles for up to 6 hours, with the old index's missing descriptions and numbers.
const srcKey=()=>IDX?IDX.wiki+'|'+IDX.built+'|'+IDX.total:'api';
function syncPool(){const k=srcKey();if(POOLSRC!==k){POOL=[];POOLSRC=k;persistPool()}}
// ---- Optional static index. If idx/manifest.json (built by build_index.py) is served next to this page, the stock is filled
// from it: the whole wiki, real numbers, no per-article API calls. If it is missing (or the page is opened from file://)
// everything silently falls back to the live Wikipedia API below, so the game works either way.
let IDX=null;
const IDXP=(async()=>{try{const r=await fetch('idx/manifest.json',{cache:'no-cache'});if(r.ok){const m=await r.json();if(m&&m.counts&&m.counts.length&&m.total>0)IDX=m}}catch{}})();
IDXP.then(()=>{syncPool();if(route==='settings')render()});
// Draw ~`total` articles: for each tier fetch a random shard and keep a random handful of its rows (stockPlan sizes the
// handfuls like the pack odds, so common tiers get most of the stock). A big wiki fills a tier from ONE shard (4000 rows);
// a small wiki or a rare tier may have fewer rows than wanted, so we top up from other random shards (up to 6 tries).
// A failed shard just yields fewer articles.
const SEASON={};
async function seasonRows(t){const k=season();if(SEASON.k!==k){for(const x of Object.keys(SEASON))delete SEASON[x];SEASON.k=k}if(SEASON[t])return SEASON[t];
 const rng=seeded(k+'|'+t),need=CFG.season.size[t],rows=[];
 for(let tries=0;rows.length<need&&tries<4;tries++){const sh=pickShard(IDX,t,rng);if(!sh)break;
  try{const r=await fetch('idx/'+shardName(sh.b,sh.s));if(!r.ok)throw new Error('HTTP '+r.status);const rs=await r.json();
   for(let i=0;i<Math.min(need-rows.length,rs.length);i++){const j=i+Math.floor(rng()*(rs.length-i));[rs[i],rs[j]]=[rs[j],rs[i]];rows.push(rs[i])}}catch(e){console.warn('Folio: season shard failed',e)}}
 return SEASON[t]=rows.map(r=>idxArticle(r,IDX))}
async function indexSample(total){const plan=stockPlan(total),out=[],seen=new Set(),ids=new Set();
 await Promise.all(plan.map(async(want,t)=>{let got=0;
  // Most of the stock comes from this week's season (a few hundred articles per rarity), so the same cards come round again and doubles
  // happen; the rest is a free draw from the whole index, which keeps the sense of discovery.
  const ss=await seasonRows(t),nS=Math.min(ss.length,Math.round(want*CFG.season.share));
  for(let tries=0;got<nS&&tries<nS*3;tries++){const a=ss[Math.floor(Math.random()*ss.length)];if(!ids.has(a.id)){ids.add(a.id);out.push(a);got++}}
  for(let tries=0;got<want&&tries<6;tries++){const sh=pickShard(IDX,t,Math.random);if(!sh)return;const key=sh.b+'-'+sh.s;if(seen.has(key))continue;seen.add(key);
   try{const r=await fetch('idx/'+shardName(sh.b,sh.s));if(!r.ok)throw new Error('HTTP '+r.status);const rows=await r.json(),k=Math.min(want-got,rows.length);
    for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(rows.length-i));[rows[i],rows[j]]=[rows[j],rows[i]];const a=idxArticle(rows[i],IDX);if(!ids.has(a.id)){ids.add(a.id);out.push(a)}}got+=k
   }catch(e){console.warn('Folio: index shard failed',e)}}}));
 return out}
const moreArts=()=>IDX?indexSample(60):topArts();
function addPool(list){POOLSRC=srcKey();for(const a of list)if(!POOL.some(x=>x.id===a.id))POOL.push(a);POOL=POOL.slice(-250);persistPool();FERR=''}
function fill(){if(filling)return filling;
 return filling=(async()=>{try{await IDXP;
  if(IDX){const l=await indexSample(120);if(!l.length)throw new Error('Could not load the article index. Check your connection and try again.');addPool(l)}
  else{const[r,t]=await Promise.allSettled([randomArts(),topArts()]);if(r.status==='rejected'&&t.status==='rejected')throw r.reason;addPool([...(r.value||[]),...(t.value||[])])}}
  catch(e){FERR=e.message}finally{filling=null}})()}
async function openPack(){regen(S,Date.now());if(busy||S.packs<1)return;busy=true;err='';RV=null;go('packs');
 try{await IDXP;syncPool();if(POOL.length<60)await fill();if(!POOL.length)throw new Error(FERR||'No articles available right now. Try again.');
  const pool=POOL.map(a=>({a,r:rate(a)})),add=l=>{for(const a of l)if(!pool.some(x=>x.a.id===a.id))pool.push({a,r:rate(a)})};
  let cards=buildPack(pool,S.pity,Math.random);
  for(let i=0;!cards&&i<3;i++){try{add(await moreArts())}catch{}cards=buildPack(pool,S.pity,Math.random)}
  if(!cards)throw new Error('Could not assemble a valid pack from Wikipedia right now. No pack was used; try again.');
  const now=Date.now();S.packs--;S.opened++;S.pity=cards.some(x=>x.r.tier>=CFG.srIdx)?0:S.pity+1;
  RV=addCards(S.col,cards,now).map(x=>({...x,on:false}));save();
  POOL=POOL.filter(a=>!cards.some(x=>x.a.id===a.id));persistPool();if(POOL.length<100)fill()}
 catch(e){err=e.message}busy=false;go('packs',true);if(S.fast&&RV)revealAll()}
function go(r,force){if(r===route&&!force&&r!=='packs'){return}route=r;if(location.hash!=='#'+r)history.replaceState(0,'','#'+r);render()}
function showCard(id){const a=(S.col[id]&&S.col[id].a)||DISC.get(+id);if(!a)return;const r=rt(a),T=CFG.tiers[r.tier],n=S.col[id]?S.col[id].n:0;
 const bar=(l,v,m,e)=>`<div>${l} <b>${v}${e?'*':''}</b></div><div class="bar"><i style="width:${v/m*100}%"></i></div>`;
 $('#modal').innerHTML=`<div class="dlg" style="--rc:${T.c}"><div>${cardHTML(a,n)}</div><div><h2>${esc(a.title)}</h2><div style="color:${T.c}">${T.n}${n?` · ${n} owned`:' · preview, not owned'}</div><p class="mute">${esc(a.desc||'No description available.')}</p>
 ${bar('Attack',r.atk,100,r.est.atk)}${bar('Defense',r.def,100,r.est.def)}${bar('Health',r.hp,132)}
 <p class="mute">Real data: ${a.length!=null?a.length.toLocaleString()+' bytes':'length unknown'} · ${a.views!=null?Math.round(a.views).toLocaleString()+' avg daily views ('+(a.vd||60)+' days)':'views unknown'} · ${a.cats!=null?a.cats+' categories':'categories unknown'}. Stats and rarity are game calculations from these numbers.</p>
 <div class="row"><a class="btn pri" href="${esc(a.url)}" target="_blank" rel="noopener" data-act="explore">Read on Wikipedia</a><button class="pri" data-act="read" data-id="${a.id}">Read here</button><button data-act="related" data-id="${a.id}">Related</button>${n>1?`<button data-act="press" data-id="${a.id}">Press a copy · +${CFG.econ.ink[r.tier]} ink</button>`:''}<button data-act="close">Close</button></div><div class="list" id="rel"></div><div class="reader" id="rd" hidden></div></div></div>`;$('#modal').classList.add('open')}
async function related(id){const a=(S.col[id]&&S.col[id].a)||DISC.get(+id),el=$('#rel');el.textContent='Loading…';
 try{const j=await wapi({generator:'search',gsrsearch:'morelike:'+a.title,gsrlimit:'6',gsrnamespace:'0',prop:'info'});const p=(j.query&&j.query.pages)||[];
  el.innerHTML=p.length?p.map(x=>`<div><a href="#" data-wl="${esc(x.title)}">${esc(x.title)}</a></div>`).join(''):'No related articles found.'}catch(e){el.textContent=e.message}}
// A genuinely random article: uniform over the whole index (shards are picked in proportion to their size), or the API's random page without it.
async function randomOne(){await IDXP;
 if(IDX){const bs=IDX.counts.map((c,b)=>[b,c[0],c[1]]).filter(x=>x[1]>0);let r=Math.random()*IDX.total,pk=bs[bs.length-1];for(const e of bs){r-=e[1];if(r<0){pk=e;break}}
  const rows=await(await fetch('idx/'+shardName(pk[0],Math.floor(Math.random()*pk[2])))).json();return[idxArticle(rows[Math.floor(Math.random()*rows.length)],IDX)]}
 return load(await wapi({generator:'random',grnnamespace:'0',grnlimit:'1'}))}
async function openTitle(t){$('#modal').classList.remove('open');go('discover',true);await discover(async()=>load(await wapi({titles:t,redirects:'1'})))}
// The reader shows an article as plain text built from Wikipedia's own HTML: no images, tables or references, but article links stay
// clickable (they open that article's card in Discover). Only elements built here are inserted, never Wikipedia's markup.
function inl(node){let s='';for(const c of node.childNodes){if(c.nodeType===3)s+=esc(c.textContent);else if(c.nodeType===1){
  if(c.tagName==='A'&&/mw:WikiLink/.test(c.getAttribute('rel')||'')){const m=(c.getAttribute('href')||'').match(/^\.\/([^#?]+)/),t=m&&decodeURIComponent(m[1]).replace(/_/g,' ');
   if(t&&!/^(File|Category|Help|Wikipedia|Template|Special|Talk|Portal|Draft|User|Module):/i.test(t)){s+=`<a href="#" data-wl="${esc(t)}">${inl(c)}</a>`;continue}}
  s+=inl(c)}}return s}
function articleText(doc){doc.querySelectorAll('table,figure,style,.hatnote,.reflist,.navbox,.mw-references-wrap,.thumb,.infobox,sup.mw-ref,.mw-editsection,.sidebar,.metadata,.shortdescription,.noprint,[typeof~="mw:Extension/references"]').forEach(n=>n.remove());
 const STOP=/^(references|external links|see also|notes|further reading|bibliography|sources|footnotes|citations)$/i,out=[];let n=0;
 for(const b of doc.body.querySelectorAll('h2,h3,h4,p,li')){const tag=b.tagName;if(tag==='LI'&&b.querySelector('li'))continue;if(/^H/.test(tag)&&STOP.test(b.textContent.trim()))break;
  const s=inl(b);if(!s.trim())continue;if(++n>400){out.push('<p class="mute">…it continues on Wikipedia.</p>');break}
  out.push(tag==='LI'?`<p class="li">• ${s}</p>`:tag==='P'?`<p>${s}</p>`:`<${tag.toLowerCase()}>${s}</${tag.toLowerCase()}>`)}
 return out.join('')||'<p class="mute">There is no readable text for this article here.</p>'}
async function readHere(id){const a=(S.col[id]&&S.col[id].a)||DISC.get(+id),el=$('#rd');if(!a||!el)return;el.hidden=false;el.innerHTML='<p class="mute">Opening the book…</p>';
 try{const r=await fetch(`https://${IDX?IDX.wiki+'.org':'en.wikipedia.org'}/api/rest_v1/page/html/${encodeURIComponent(a.title.replace(/ /g,'_'))}`);if(!r.ok)throw new Error('Wikipedia returned HTTP '+r.status);
  el.innerHTML=articleText(new DOMParser().parseFromString(await r.text(),'text/html'));el.scrollTop=0;el.scrollIntoView({block:'nearest'})}catch(e){el.innerHTML=`<p>${esc(e.message)}</p>`}}
async function discover(fn){const g=$('#dg');g.innerHTML='<p class="mute">Loading…</p>';
 try{const l=await fn();l.forEach(a=>DISC.set(a.id,a));g.innerHTML=l.length?l.map(a=>cardHTML(a,0)).join(''):'<p class="mute">No articles found.</p>';if(l.length===1)showCard(l[0].id)}catch(e){g.innerHTML=`<p>${esc(e.message)}</p>`}}
document.addEventListener('click',e=>{const wl=e.target.closest('[data-wl]');if(wl){e.preventDefault();openTitle(wl.dataset.wl);return}const el=e.target.closest('[data-act]'),a=el&&el.dataset.act;
 if(!a){const c=e.target.closest('.card');if(c)cardClick(c);else if(e.target.id==='modal')$('#modal').classList.remove('open');return}
 if(a==='go')go(el.dataset.to);else if(a==='open')openPack();
 else if(a==='flip')flipSlot(+el.dataset.i);else if(a==='all')revealAll();
 else if(a==='login'){const g=claim(S,'login',Date.now());if(g){save();toast('+'+g+' packs');render()}}
 else if(a==='explore'){if(claim(S,'explore',Date.now())){save();toast('Explorer bonus: +1 pack');renderStock()}}
 else if(a==='more'){F.more+=60;grid()}else if(a==='close')$('#modal').classList.remove('open');
 else if(a==='related')related(el.dataset.id);else if(a==='rand')discover(randomOne);
 else if(a==='search'){const q=$('#sq').value.trim();if(q)discover(async()=>load(await wapi({generator:'search',gsrsearch:q,gsrlimit:'12',gsrnamespace:'0'})))}
 else if(a==='raid'||a==='practice')startBattle(a);else if(a==='auto'){SEL=new Set(cols().sort((x,y)=>pw(y)-pw(x)).slice(0,CFG.battle.raidMax).map(x=>x.a.id));render()}
 else if(a==='clear'){SEL.clear();render()}else if(a==='bretry'){BERR='';loadBoss()}
 else if(a==='tradeopen'){const t=+el.dataset.tier,pool=POOL.map(x=>({a:x,r:rt(x)})),used=new Set(),o=[];for(let i=0;i<3;i++){const c=pick(pool,t+1,used,Math.random);if(c&&c.r.tier>t){used.add(c.a.id);o.push(c.a);DISC.set(c.a.id,c.a)}}if(o.length){TU={tier:t,offers:o};render()}else toast('Nothing rarer in the stock right now. Try again in a moment.')}
 else if(a==='tradepick'){const c=TU&&TU.offers.find(x=>x.id===+el.dataset.id);if(c&&tradeUp(S,TU.tier,c,Date.now())){save();toast('Bound: '+c.title);TU=null;render()}}
 else if(a==='tradecancel'){TU=null;render()}
 else if(a==='buy'){if(buyOffer(S,+el.dataset.i,Date.now())){save();render()}}
 else if(a==='pressall'){const g=pressAll(S,+el.dataset.max);if(g){save();toast('+'+g+' ink');render()}else toast('No spare copies to press.')}
 else if(a==='claim'){const g=claimGoal(S,el.dataset.key);if(g){save();toast('+'+g.p+' packs, +'+g.i+' ink');render()}}
 else if(a==='claimall'){let n=0;for(const g of goals(S))if(g.done&&!g.claimed&&claimGoal(S,g.key))n++;if(n){save();toast(n+' rewards claimed');render()}}
 else if(a==='press'){const g=press(S,el.dataset.id);if(g){save();toast('+'+g+' ink');showCard(el.dataset.id);renderStock();nav()}}
 else if(a==='fast'){S.fast=!S.fast;save();render()}else if(a==='read')readHere(el.dataset.id)
 else if(a==='reset'&&confirm('Delete your whole collection and progress?')){S=fresh();save();RC.clear();POOL=[];persistPool();go('home',true)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;F.more=60;grid()}});
document.addEventListener('change',e=>{if(e.target.id==='fr'){F.r=e.target.value;F.more=60;grid()}if(e.target.id==='fd'){F.d=e.target.value;F.more=60;grid()}if(e.target.id==='fs'){F.s=e.target.value;grid()}});
document.addEventListener('keydown',e=>{const sp=document.querySelector('.spot');if(sp&&[' ','Enter','Escape'].includes(e.key)){e.preventDefault();sp.click();return}if(e.key===' '&&route==='packs'&&!busy&&!/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(e.target.tagName)){e.preventDefault();const i=RV?RV.findIndex(x=>!x.on):-1;if(i>=0)flipSlot(i);else openPack()}if(e.key==='Escape')$('#modal').classList.remove('open');if(e.key==='Enter'){if(e.target.classList.contains('card'))cardClick(e.target);if(e.target.id==='sq')document.querySelector('[data-act=search]').click()}});
addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(V[r]&&r!==route){route=r;render()}});
setInterval(()=>{const p=S.packs;renderStock();if(S.packs!==p){save();if(route==='packs'&&!busy&&!RV)render()}},1000);
// Cards saved before the fix have no views; fill them in once per load (rarity is recomputed from the real numbers).
async function backfill(){const todo=cols().filter(e=>e.a.views==null);
 for(let i=0;i<todo.length;i+=50)await enrich(todo.slice(i,i+50).map(e=>e.a));
 if(todo.some(e=>e.a.views!=null)){RC.clear();save();if(route!=='packs')render()}}
route=V[location.hash.slice(1)]?location.hash.slice(1):'home';regen(S,Date.now());save();render();backfill();if(POOL.length<100)fill();
</script></body></html>
